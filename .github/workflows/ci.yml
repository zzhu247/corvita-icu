name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.1"          # same patch version that trained models/v1
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      # Tests use synthetic data in PhysioNet format. CI never sees patient data.
      - run: make test

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.1"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock   # for the monitor, which runs on the host

      - name: Build image
        run: docker build -t corvita-icu:${{ github.sha }} .

      - name: Start container with request logs on the host
        run: |
          mkdir -p logs && chmod 777 logs     # container user (uid 10001) must be able to write here
          docker run -d -p 8000:8000 --name api \
            -e LOG_PATH=/app/logs/requests.jsonl -v "$PWD/logs:/app/logs" \
            corvita-icu:${{ github.sha }}
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health

      - name: Valid, missing-vitals and invalid requests
        run: |
          post() { curl -s -o /tmp/out.json -w "%{http_code}" -X POST localhost:8000/predict \
                     -H "content-type: application/json" -d @"$1"; }
          test "$(post examples/valid.json)" = "200"           && cat /tmp/out.json && echo
          test "$(post examples/missing_vitals.json)" = "200"  && cat /tmp/out.json && echo
          grep -q '"missing_vitals":\["RespRate"\]' /tmp/out.json
          test "$(post examples/invalid.json)" = "422"         && cat /tmp/out.json && echo

      - name: Request log and monitoring check
        run: |
          test "$(wc -l < logs/requests.jsonl)" -ge 3
          python -m src.monitor --log logs/requests.jsonl   # 3 requests -> insufficient_traffic, exit 0

      - name: Container logs
        if: always()
        run: docker logs api || true
